# =============================================================================
# Stage 1.1 并行量化编排
# 说明：量化是有限、参数化的批处理任务，故采用 batch/v1 Job（每个 run_id 一个
# Job），比单一 Deployment 更适合"每个 Pod 跑不同组合"。文件名仍按工作流命名。
# 每个 Job：挂载同一 OSS PVC 到 /data，注入 RUN_ID；GPU 资源请求驱动节点自动
# 扩缩容，required 反亲和保证各 Pod 分散到不同节点并行执行。
# 前置：serviceAccountName 对应的 RRSA 已配置（stage3.0.1.2 验证）。
# 应用：kubectl apply -f deployment_stage_1_1.yaml
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: quant-smoothquant-w8a8-all
  labels: {app: quantflow, stage: stage-1-1, run-id: smoothquant__w8a8__all}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: quantflow, stage: stage-1-1}
    spec:
      serviceAccountName: quantflow-rrsa
      restartPolicy: Never
      containers:
        - name: quant
          image: test-acr-business-registry.cn-shanghai.cr.aliyuncs.com/test-llm-compressor/test:stage-1-1-v1
          env:
            - name: RUN_ID
              value: smoothquant__w8a8__all
          volumeMounts:
            - name: oss-data
              mountPath: /data
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "4", memory: 12Gi}
            limits: {nvidia.com/gpu: "1", cpu: "8", memory: 16Gi}
      volumes:
        - name: oss-data
          persistentVolumeClaim: {claimName: pvc-stage-1-1}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: quantflow, stage: stage-1-1}
              topologyKey: kubernetes.io/hostname
