# =============================================================================
# Stage 1.2 编排：单节点微调最优量化模型（一个 Job，一个 Pod，一张 GPU）
# 应用：kubectl apply -f deployment_stage_1_2.yaml
# BEST_RUN_ID 留空时，容器内脚本读取 /data/output/best_selection.json。
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: finetune-stage-1-2
  labels:
    app: quantflow
    stage: stage-1-2
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: quantflow
        stage: stage-1-2
    spec:
      serviceAccountName: quantflow-rrsa
      restartPolicy: Never
      containers:
        - name: finetune
          image: test-acr-business-registry.cn-shanghai.cr.aliyuncs.com/test-llm-compressor/test:stage-1-2-v1
          env:
            - name: BEST_RUN_ID
              value: ""
            - name: MAX_STEPS
              value: "500"
          volumeMounts:
            - name: oss-data
              mountPath: /data
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "8", memory: 24Gi}
            limits: {nvidia.com/gpu: "1", cpu: "16", memory: 32Gi}
      volumes:
        - name: oss-data
          persistentVolumeClaim:
            claimName: pvc-stage-1-2
