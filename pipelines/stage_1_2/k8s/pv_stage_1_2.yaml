# =============================================================================
# Stage 1.2 PV：OSS CSI 挂载同一 bucket（RRSA）
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-stage-1-2
  labels:
    app: quantflow
    stage: stage-1-2
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ossplugin.csi.alibabacloud.com
    volumeHandle: oss-csi-stage-1-2
    volumeAttributes:
      fuseType: ossfs2
      bucket: test-llm-compressor
      region: cn-shanghai
      path: /
      url: "https://oss-cn-shanghai-internal.aliyuncs.com"
      otherOpts: "-o close_to_open=false"
      authType: "rrsa"
      roleName: "rrsa"
      sigVersion: "v4"
