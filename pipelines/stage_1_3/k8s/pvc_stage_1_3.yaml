# =============================================================================
# Stage 1.3 PVC：绑定 pv-stage-1-3
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-stage-1-3
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 200Gi
  volumeName: pv-stage-1-3
  selector:
    matchLabels:
      app: quantflow
      stage: stage-1-3
