# =============================================================================
# Stage 3.0.1.4 OSS 挂载测试 Deployment：使用轻量 busybox（约几 MB）
# 应用后执行：
#   kubectl exec -it deploy/oss-mount-test -- ls -la /data
# 验证可读后按工作流暂停，由用户删除对应 pod 和 node：
#   kubectl delete -f oss_mount_deployment.yaml -f oss_mount_pvc.yaml -f oss_mount_pv.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss-mount-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oss-mount-test
  template:
    metadata:
      labels:
        app: oss-mount-test
    spec:
      serviceAccountName: quantflow-rrsa
      containers:
        - name: box
          image: busybox:1.36
          command: ["sleep", "36000"]
          volumeMounts:
            - name: oss-data
              mountPath: /data
      volumes:
        - name: oss-data
          persistentVolumeClaim:
            claimName: pvc-oss-mount-test
