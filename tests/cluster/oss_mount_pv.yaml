# =============================================================================
# Stage 3.0.1.4 OSS 挂载测试 PV（仅用于校验，volumeHandle 独立）
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-oss-mount-test
  labels:
    app: oss-mount-test
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ossplugin.csi.alibabacloud.com
    volumeHandle: oss-csi-mount-test
    volumeAttributes:
      fuseType: ossfs2
      bucket: test-llm-compressor
      region: cn-shanghai
      path: /
      url: "https://oss-cn-shanghai-internal.aliyuncs.com"
      otherOpts: "-o close_to_open=false"
      authType: "rrsa"
      roleName: "rrsa"
      sigVersion: "v4"
