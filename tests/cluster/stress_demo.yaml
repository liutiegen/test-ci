# =============================================================================
# Stage 3.0.1.3 节点自动扩缩容测试：期望触发 2 个新节点 + 2 个 Pod
# 测试镜像：crpi-kqhgoddj8ldwo4ba.cn-shanghai.personal.cr.aliyuncs.com/test_random/test_ray:v1
# 应用：kubectl apply -f stress_demo.yaml
# 验证后按工作流暂停，由用户删除对应 node 和 pod：
#   kubectl delete -f stress_demo.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress-demo
  template:
    metadata:
      labels:
        app: stress-demo
    spec:
      containers:
        - name: stress
          image: crpi-kqhgoddj8ldwo4ba.cn-shanghai.personal.cr.aliyuncs.com/test_random/test_ray:v1
          command: ["sleep", "36000"]
          resources:
            # requests 是节点伸缩判断依据，不能省略
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
